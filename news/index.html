<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Game Industry Daily</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: issue picker → headline → top-3 image cards → one band per section (female-oriented band tinted) → sources. */
:root{
  --bg:#F4F3F7; --surface:#FFFFFF; --ink:#17152A; --muted:#5F5B78; --line:#E2DFEB;
  --accent:#4B3FD8; --accent-soft:#ECEAFD; --fem:#C2306E; --fem-soft:#FCE9F1; --live:#0E8C6B; --live-soft:#E3F5EF; --shade:rgba(12,10,30,.8);
  --body:"Be Vietnam Pro",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#100F19; --surface:#1A1928; --ink:#EEEDF7; --muted:#A09CBA; --line:#2C2A40;
  --accent:#9A91FF; --accent-soft:#25224A; --fem:#F27AAE; --fem-soft:#3A1B2B; --live:#4FD1A8; --live-soft:#14332A; --shade:rgba(0,0,0,.82); color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
img{max-width:100%}
.wrap{max-width:1000px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
h1{margin:0;font-size:clamp(26px,5vw,38px);font-weight:800;letter-spacing:-.025em;line-height:1.1}
h1 small{display:block;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
h2 .n{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--muted)}
.note{font-size:12px;color:var(--muted)}
.label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.issues{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.iss{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer;text-align:left;line-height:1.3}
.iss b{display:block}
.iss span{color:var(--muted);font-size:12px}
.iss[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.iss[aria-pressed="true"] span{color:inherit;opacity:.75}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lead{font-size:17px;line-height:1.6;max-width:72ch;margin:0}
.toc{display:flex;flex-wrap:wrap;gap:6px}
.toc a{font-size:13px;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px}
.toc a.fem{border-color:var(--fem);color:var(--fem)}
section{display:flex;flex-direction:column;gap:14px;scroll-margin-top:16px}
.top3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:760px){.top3{grid-template-columns:1fr}}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.tcard .media{position:relative;aspect-ratio:16/9;max-width:100%;background:var(--accent-soft);overflow:hidden}
.tcard .media img{width:100%;height:100%;object-fit:cover;display:block}
.tcard .media::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--shade),transparent 65%)}
.tcard .over{position:absolute;left:14px;right:14px;bottom:10px;z-index:1;color:#fff}
.tcard .over .k{font-family:var(--mono);font-size:12px;opacity:.85}
.tcard .over h3{margin:2px 0 0;font-size:17px;line-height:1.3;text-wrap:balance}
.tcard .info{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.tcard .info p{margin:0;font-size:14px}
.do{background:var(--live-soft);border-radius:8px;padding:8px 10px;font-size:14px}
.do strong{color:var(--live)}
.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.list{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:start}
.thumb{width:96px;height:96px;border-radius:10px;overflow:hidden;background:var(--accent-soft);display:flex;align-items:center;justify-content:center}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.ph{font-size:11px;font-weight:700;color:var(--accent);text-align:center;padding:6px;line-height:1.2}
.card .b{min-width:0;display:flex;flex-direction:column;gap:5px}
.card h3{margin:0;font-size:15px;line-height:1.35}
.card h3 a{color:inherit;text-decoration:none}
.card h3 a:hover{text-decoration:underline}
.card p{margin:0;font-size:14px;color:var(--muted)}
.card .lo{color:var(--ink);font-size:13px;background:var(--live-soft);border-radius:6px;padding:5px 8px}
.card .lo strong{color:var(--live)}
.src{font-size:12px;color:var(--muted)}
.src a{color:var(--accent)}
@media (max-width:420px){.card{grid-template-columns:72px minmax(0,1fr)}.thumb{width:72px;height:72px}}
.band-fem{background:var(--fem-soft);border-radius:18px;padding:18px}
.band-fem h2{color:var(--fem)}
.band-fem .card{border-color:color-mix(in srgb,var(--fem) 25%,var(--line))}
.band-fem .thumb{background:color-mix(in srgb,var(--fem) 18%,var(--surface))}
.band-fem .ph{color:var(--fem)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:28px 20px;text-align:center;color:var(--muted)}
footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
footer a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><small>Bản tin live-ops</small>Game Industry Daily</h1>
    <div class="note" id="status">Đang tải…</div>
  </header>
  <div>
    <div class="label" style="margin-bottom:8px">Các số</div>
    <div class="issues" id="issues" role="group" aria-label="Chọn số bản tin"></div>
  </div>
  <div id="content"><div class="empty">Chưa có số nào. Bản tin được cập nhật lúc 8:00 mỗi sáng.</div></div>
  <footer>Tổng hợp tự động từ báo game trong nước và quốc tế, theo góc nhìn live-ops. Trend mạng xã hội VN: <a href="../">Nhịp Threads VN</a>.</footer>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const okUrl = u => typeof u === "string" && /^https:\/\//.test(u);
let issues = [], current = null;

function img(it, cls){
  const ph = `<div class="ph">${esc(it.source||"Tin")}</div>`;
  return okUrl(it.image) ? `<img src="${esc(it.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph',textContent:${JSON.stringify(String(it.source||'Tin'))}}))">` : ph;
}
function card(it){
  return `<article class="card">
    <div class="thumb">${img(it)}</div>
    <div class="b">
      <h3>${okUrl(it.url)?`<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>`:esc(it.title)}</h3>
      ${it.summary?`<p>${esc(it.summary)}</p>`:""}
      ${it.liveops?`<div class="lo"><strong>Live-ops:</strong> ${esc(it.liveops)}</div>`:""}
      <div class="src">${esc(it.source||"")}</div>
    </div></article>`;
}
function renderIssues(){
  $("#issues").innerHTML = issues.map(x => {
    const d = new Date(x.date + "T00:00:00");
    const n = (x.top||[]).length + (x.sections||[]).reduce((s,c)=>s+(c.items||[]).length,0);
    return `<button class="iss" aria-pressed="${x.id===current}" data-id="${esc(x.id)}"><b>${esc(d.toLocaleDateString("vi-VN",{weekday:"short",day:"2-digit",month:"2-digit"}))}</b><span>${n} tin</span></button>`;
  }).join("");
  document.querySelectorAll(".iss").forEach(b => b.onclick = () => { current = b.dataset.id; renderIssues(); render(); window.scrollTo({top:0}); });
}
function render(){
  const x = issues.find(i => i.id === current); if(!x) return;
  const secs = (x.sections||[]).filter(s => (s.items||[]).length);
  const toc = secs.map(s => `<a href="#s-${esc(s.key)}" class="${s.key==="fem"?"fem":""}">${esc(s.name)} (${s.items.length})</a>`).join("");
  const top = (x.top||[]).map((it,i) => `
    <article class="tcard">
      <div class="media">${img(it)}<div class="over"><div class="k">#${i+1} · ${esc(it.source||"")}</div><h3>${esc(it.title)}</h3></div></div>
      <div class="info">
        ${it.summary?`<p>${esc(it.summary)}</p>`:""}
        ${it.liveops?`<div class="do"><strong>Nên làm:</strong> ${esc(it.liveops)}</div>`:""}
        ${okUrl(it.url)?`<a class="src" href="${esc(it.url)}" target="_blank" rel="noopener">Đọc bài gốc</a>`:""}
      </div></article>`).join("");
  const body = secs.map(s => `
    <section id="s-${esc(s.key)}" class="${s.key==="fem"?"band-fem":""}">
      <h2>${esc(s.name)} <span class="n">${s.items.length} tin</span></h2>
      ${s.intro?`<p class="note" style="margin:0;font-size:14px">${esc(s.intro)}</p>`:""}
      <div class="list">${s.items.map(card).join("")}</div>
    </section>`).join("");
  $("#content").innerHTML = `<div style="display:flex;flex-direction:column;gap:28px">
    ${x.headline?`<p class="lead">${esc(x.headline)}</p>`:""}
    ${toc?`<nav class="toc" aria-label="Mục lục">${toc}</nav>`:""}
    ${top?`<section><h2>3 điều live-ops cần biết hôm nay</h2><div class="top3">${top}</div></section>`:""}
    ${body}
    ${x.sources?`<p class="note">Nguồn: ${esc(x.sources)}</p>`:""}
  </div>`;
}
(async () => {
  try {
    const r = await fetch("data.json?t=" + Date.now(), {cache:"no-store"});
    if(!r.ok) throw 0;
    const d = await r.json();
    issues = (d.issues||[]).slice().sort((a,b)=>String(b.runAt||"").localeCompare(String(a.runAt||"")));
    $("#status").textContent = issues.length ? `${issues.length} số · cập nhật ${new Date(d.updatedAt).toLocaleString("vi-VN",{hour:"2-digit",minute:"2-digit",day:"2-digit",month:"2-digit"})}` : "Chưa có dữ liệu";
    if(!issues.length) return;
    const want = location.hash.slice(1);
    current = issues.some(i=>i.id===want) ? want : issues[0].id;
    renderIssues(); render();
  } catch(e) { $("#status").textContent = "Không tải được dữ liệu. Tải lại trang để thử lại."; }
})();
</script>
</body>
</html>
